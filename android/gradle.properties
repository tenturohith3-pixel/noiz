# JVM
# Sized for a 4 GB / 4-core machine (the dev box this was last built on). The
# previous -Xmx4g + 1g metaspace, combined with a *separate* Kotlin daemon JVM,
# exceeded physical RAM and the build was OOM-killed before a single file compiled.
# Raise these on a bigger machine for a faster build.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
# Compile inside the Gradle process. The default spawns a second long-lived JVM for
# the Kotlin compiler, which does not fit in the remaining RAM on a small machine.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# AGP 8.7.3 predates compileSdk 36; silence the "untested compileSdk" warning.
android.suppressUnsupportedCompileSdk=36