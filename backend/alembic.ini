# Alembic configuration.
#
# `sqlalchemy.url` is intentionally empty: `migrations/env.py` reads the DSN from
# `noiz.core.settings.get_settings().database_url`. Keeping the URL out of this file
# means one source of truth (NOIZ_DATABASE_URL) instead of two that drift apart.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# Timestamped, descriptive revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timezone = UTC

[post_write_hooks]
# No auto-generation formatting: the migrations are hand-maintained and reviewed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S