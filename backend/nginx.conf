# noiz edge (ADR 5, §2.2, §9.4)
#
# nginx owns three jobs and nothing else:
#   1. TLS + HTTP/2 termination and rate limiting on /auth/*;
#   2. forwarding the API to uvicorn;
#   3. serving media bytes with sendfile, honouring Range/ETag, from an *internal*
#      location that only X-Accel-Redirect can reach — so a client can never fetch a
#      media file by guessing a path, only with a valid HMAC signature.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # HTTP/2 needs a bigger header buffer on long-lived media clients.
    large_client_header_buffers 4 16k;

    log_format noiz escape=json
        '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"range":"$http_range","rt":$request_time,"ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log noiz;

    # §12: 5 requests/minute/IP on the auth endpoints, in a 10 MB shared zone.
    limit_req_zone $binary_remote_addr zone=noiz_auth:10m rate=5r/m;
    limit_req_status 429;

    upstream noiz_api {
        server api:8000;
        keepalive 32;
    }

    # Only these containers/hosts may read media through the internal location.
    geo $internal_client {
        default 0;
        127.0.0.1/32 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name noiz.example;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols       TLSv1.3 TLSv1.2;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        client_max_body_size 0;   # tus uploads stream through; size is enforced by the API
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # --- Auth (rate limited) -------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=noiz_auth burst=5 nodelay;
            proxy_pass http://noiz_api;
        }

        # --- Health probe used by the client's endpoint prober (§2.4) -------
        location = /healthz {
            proxy_pass http://noiz_api;
            access_log off;
        }

        # --- Media and artwork ---------------------------------------------
        # The API validates the HMAC and replies with X-Accel-Redirect; nginx then
        # serves the file itself, including Range and conditional requests.
        location /stream/ {
            proxy_pass http://noiz_api;
            proxy_buffering off;
            proxy_request_buffering off;
            # Media responses are private + revalidated; the client's SimpleCache is the
            # only shared cache in the system, so no proxy caching here.
            proxy_read_timeout 1h;
        }

        location /artwork/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://noiz_api;
        }

        # Internal: reachable only via X-Accel-Redirect from the API container.
        # `internal` makes it a 404 for anyone who tries to request it directly.
        location /_media/ {
            internal;
            alias /media/;
            sendfile on;
            aio threads;
            directio 8m;

            add_header Accept-Ranges bytes always;
            # Renditions are immutable per (track, id); ETag comes from the API.
            add_header Cache-Control "private, max-age=0, must-revalidate" always;

            # Range is enabled implicitly by nginx for static files; an unsatisfiable
            # range produces 416 with Content-Range: bytes */<size> automatically.
            if_modified_since exact;
        }

        # --- Everything else is the API -------------------------------------
        location / {
            proxy_pass http://noiz_api;
            proxy_read_timeout 300s;
        }
    }

    # Plain HTTP only exists to redirect and to answer ACME challenges.
    server {
        listen 80;
        server_name noiz.example;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
